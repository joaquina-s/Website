name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build job: package the repo root as the Pages artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The site is plain static HTML at the repo root — no build step needed.
          path: '.'

  # Deploy job: a separate job (needs: build) so the artifact is fully
  # registered before deploy-pages queries its metadata. This avoids the
  # intermittent "No artifacts named github-pages were found / Found 0
  # artifact(s)" race that a single upload+deploy job hits on this heavy
  # (~300 MB) site.
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 600000 ms is the action's allowed maximum; the media payload is
          # large, so give Pages the full window to sync.
          timeout: 600000
          error_count: 25
